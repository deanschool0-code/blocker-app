# XcodeGen spec. Generate the Xcode project with:  ./setup.sh   (or: xcodegen generate)
# Edit this file, not the .xcodeproj — the project is regenerated from it.
name: Blocker
options:
  bundleIdPrefix: com.deancarson
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: L6MYJJZMXT  # Dean's team (same as DMs Only)
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO   # we use Palette tokens, not generated symbols

packages:
  BlockerCore:
    path: Packages/BlockerCore

targetTemplates:
  ContentBlocker:
    type: app-extension
    dependencies:
      - package: BlockerCore
    settings:
      base:
        SKIP_INSTALL: YES

targets:
  # ───────────── iPhone / iPad app ─────────────
  Blocker-iOS:
    type: application
    platform: iOS
    sources:
      - App
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: BlockerCore
      - target: BlockerA-iOS
      - target: BlockerB-iOS
    info:
      path: Config/App-iOS-Info.plist
      properties:
        CFBundleDisplayName: Blocker
        AppGroupIdentifier: group.com.deancarson.blocker
        UILaunchScreen:
          UIColorName: Background
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.deancarson.blocker.refresh]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.healthcare-fitness
    entitlements:
      path: Config/App-iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.deancarson.blocker]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.deancarson.blocker
    settings:
      base:
        PRODUCT_NAME: Blocker
        PRODUCT_BUNDLE_IDENTIFIER: com.deancarson.blocker
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  BlockerA-iOS:
    templates: [ContentBlocker]
    platform: iOS
    sources:
      - Extensions/Shared
      - path: Extensions/BlockerA
        buildPhase: resources
    info:
      path: Config/BlockerA-iOS-Info.plist
      properties:
        CFBundleDisplayName: Blocker – Core list
        AppGroupIdentifier: group.com.deancarson.blocker
        BlockerSlot: A
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler
    entitlements:
      path: Config/BlockerA-iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.deancarson.blocker]
    settings:
      base:
        PRODUCT_NAME: BlockerA
        PRODUCT_BUNDLE_IDENTIFIER: com.deancarson.blocker.blockerA

  BlockerB-iOS:
    templates: [ContentBlocker]
    platform: iOS
    sources:
      - Extensions/Shared
      - path: Extensions/BlockerB
        buildPhase: resources
    info:
      path: Config/BlockerB-iOS-Info.plist
      properties:
        CFBundleDisplayName: Blocker – More sites & yours
        AppGroupIdentifier: group.com.deancarson.blocker
        BlockerSlot: B
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler
    entitlements:
      path: Config/BlockerB-iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.deancarson.blocker]
    settings:
      base:
        PRODUCT_NAME: BlockerB
        PRODUCT_BUNDLE_IDENTIFIER: com.deancarson.blocker.blockerB

  # ───────────── Mac app ─────────────
  Blocker-macOS:
    type: application
    platform: macOS
    sources:
      - App
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: BlockerCore
      - target: BlockerA-macOS
      - target: BlockerB-macOS
    info:
      path: Config/App-macOS-Info.plist
      properties:
        CFBundleDisplayName: Blocker
        AppGroupIdentifier: $(DEVELOPMENT_TEAM).com.deancarson.blocker
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Config/App-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)com.deancarson.blocker]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.deancarson.blocker
    settings:
      base:
        PRODUCT_NAME: Blocker
        PRODUCT_BUNDLE_IDENTIFIER: com.deancarson.blocker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES

  BlockerA-macOS:
    templates: [ContentBlocker]
    platform: macOS
    sources:
      - Extensions/Shared
      - path: Extensions/BlockerA
        buildPhase: resources
    info:
      path: Config/BlockerA-macOS-Info.plist
      properties:
        CFBundleDisplayName: Blocker – Core list
        AppGroupIdentifier: $(DEVELOPMENT_TEAM).com.deancarson.blocker
        BlockerSlot: A
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler
    entitlements:
      path: Config/BlockerA-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)com.deancarson.blocker]
    settings:
      base:
        PRODUCT_NAME: BlockerA
        PRODUCT_BUNDLE_IDENTIFIER: com.deancarson.blocker.blockerA
        ENABLE_HARDENED_RUNTIME: YES

  BlockerB-macOS:
    templates: [ContentBlocker]
    platform: macOS
    sources:
      - Extensions/Shared
      - path: Extensions/BlockerB
        buildPhase: resources
    info:
      path: Config/BlockerB-macOS-Info.plist
      properties:
        CFBundleDisplayName: Blocker – More sites & yours
        AppGroupIdentifier: $(DEVELOPMENT_TEAM).com.deancarson.blocker
        BlockerSlot: B
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler
    entitlements:
      path: Config/BlockerB-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)com.deancarson.blocker]
    settings:
      base:
        PRODUCT_NAME: BlockerB
        PRODUCT_BUNDLE_IDENTIFIER: com.deancarson.blocker.blockerB
        ENABLE_HARDENED_RUNTIME: YES

schemes:
  Blocker-iOS:
    build:
      targets:
        Blocker-iOS: all
    run:
      config: Debug
    test:
      config: Debug
  Blocker-macOS:
    build:
      targets:
        Blocker-macOS: all
    run:
      config: Debug
